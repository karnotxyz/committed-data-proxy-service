[package]
name = "committed-data-proxy-service"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
mongodb = "3.5.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
