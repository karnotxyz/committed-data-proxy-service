[package]
name = "committed-data-proxy-service"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
bincode = "1.3"
hex = "0.4"
mongodb = "3.5.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starknet-core = { package = "starknet-rust-core", version = "0.19.0-rc.2" }
starknet-types-core = { version = "0.2.4", default-features = false, features = ["hash", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
