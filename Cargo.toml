[package]
name = "committed-data-proxy-service"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
mongodb = "3.5.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starknet-core = { package = "starknet-rust-core", version = "0.19.0-rc.2" }
starknet-types-core = { version = "0.2.4", default-features = false, features = ["hash", "serde"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"
